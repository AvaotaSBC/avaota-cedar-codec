name: Build and publish Sun55i Cedar APT repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cedar-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            apt-utils binutils binutils-aarch64-linux-gnu debhelper dpkg-dev \
            g++-aarch64-linux-gnu gcc-aarch64-linux-gnu gnupg make \
            patchelf pkgconf python3 xz-utils
      - name: Build arm64 packages
        run: ./build.sh
      - name: Collect current packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(dpkg-parsechangelog -S Version)
          mkdir -p dist/packages
          cp ../avaota-cedar-*_"$version"_arm64.deb dist/packages/
          test "$(find dist/packages -name '*.deb' | wc -l)" -eq 8
      - uses: actions/upload-artifact@v4
        with:
          name: avaota-sun55i-cedar-arm64
          if-no-files-found: error
          path: dist/packages/*.deb

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: avaota-sun55i-cedar-arm64
          path: dist/packages
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apt-utils gnupg
      - name: Import signing key
        shell: bash
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_GPG_PRIVATE_KEY" || { echo 'Missing APT_GPG_PRIVATE_KEY secret' >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/cedar-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          test -n "$key_id"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "APT_SIGNING_KEY=$key_id" >> "$GITHUB_ENV"
      - name: Generate signed APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          ./scripts/make-apt-repo.sh \
            --packages dist/packages \
            --site dist/site \
            --key-id "$APT_SIGNING_KEY" \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cp README.md dist/site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
        id: deploy
